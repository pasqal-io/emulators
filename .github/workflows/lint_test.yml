  preview_docs:
    #needs: test
    if: github.event.action != 'closed' # No need to build docs when PR is closed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout emulators
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install everything & build documentation
        run: |
          pip install -e .
          pip install -r doc_requirements.txt
          mkdocs build --clean --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ./site/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
          preview-branch: gh-pages
          qr-code: false
